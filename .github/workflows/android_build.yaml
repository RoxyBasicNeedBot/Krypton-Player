name: Build APKs

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish official GitHub release (notifies users)'
        required: false
        type: boolean
        default: false
  push:
    branches: [ 'main', 'dev' ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  discussions: write
  actions: write

jobs:
  notifyTelegram:
    name: Notify Telegram
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Security Guardrail - Audit for Credential Leaks
        run: |
          python scripts/security_audit.py

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Send a message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true) }}
        run: |
          python ./.github/workflows/notify_telegram.py
        continue-on-error: true

  build:
    name: Build Release & Debug APKs
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security Guardrail - Audit for Credential Leaks
        run: |
          python3 scripts/security_audit.py

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build hash
        id: build_hash
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Google Services Configuration
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
              printf "%s\n" "$GOOGLE_SERVICES_CONTENT" > app/google-services.json
            elif [ -f "app/google-services.json.example" ]; then
              cp app/google-services.json.example app/google-services.json
            fi
          fi
          # Strictly validate JSON; fallback to clean template if invalid
          python3 -c "import json; json.load(open('app/google-services.json'))" || cp app/google-services.json.example app/google-services.json

      - name: Ensure Clean Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f "app/release.keystore" ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
              echo "✅ Restored release.keystore from secret"
            else
              keytool -genkeypair -v \
                -keystore app/release.keystore \
                -alias archplayer \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-your_keystore_password_here}" \
                -keypass "${KEY_PASSWORD:-your_key_password_here}" \
                -dname "CN=Arch Player, OU=Mobile, O=ArchPlayer, L=New Delhi, ST=Delhi, C=IN"
            fi
          else
            echo "✅ Using release keystore"
          fi

      - name: Ensure Native TDLib (libtdjni.so) Binaries
        run: |
          echo "=== 🔍 Checking Native TDLib (libtdjni.so) ==="
          mkdir -p core/data/src/main/jniLibs/arm64-v8a core/data/src/main/jniLibs/armeabi-v7a core/data/libs

          ARM64_SO="core/data/src/main/jniLibs/arm64-v8a/libtdjni.so"
          ARM32_SO="core/data/src/main/jniLibs/armeabi-v7a/libtdjni.so"
          TDLIB_JAR="core/data/libs/tdlib.jar"

          # Check if valid binary and matching jar already exist
          if [ ! -f "$ARM64_SO" ] || [ ! -f "$TDLIB_JAR" ]; then
            echo "📥 Downloading official prebuilt TDLib AAR from GitHub releases..."
            curl -L -o /tmp/tdlib-core.aar "https://github.com/AkashPriyadarshii/tdlib-android/releases/download/v0.1.0/core-release.aar"
            unzip -q /tmp/tdlib-core.aar "jni/arm64-v8a/libtdjni.so" -d /tmp/
            unzip -q /tmp/tdlib-core.aar "jni/armeabi-v7a/libtdjni.so" -d /tmp/
            unzip -q /tmp/tdlib-core.aar "classes.jar" -d /tmp/
            cp /tmp/jni/arm64-v8a/libtdjni.so "$ARM64_SO"
            cp /tmp/jni/armeabi-v7a/libtdjni.so "$ARM32_SO"
            cp /tmp/classes.jar "$TDLIB_JAR"
            rm -rf /tmp/tdlib-core.aar /tmp/jni /tmp/classes.jar
          fi

          echo "Listing native libraries:"
          ls -lh core/data/src/main/jniLibs/arm64-v8a/
          ls -lh core/data/src/main/jniLibs/armeabi-v7a/

          # Strict Nagram-style validation before building
          if [ ! -f "$ARM64_SO" ]; then
            echo "❌ CRITICAL ERROR: arm64-v8a libtdjni.so is MISSING!"
            exit 1
          fi
          if [ ! -f "$ARM32_SO" ]; then
            echo "❌ CRITICAL ERROR: armeabi-v7a libtdjni.so is MISSING!"
            exit 1
          fi
          echo "✅ Native TDLib libraries validated successfully!"

      - name: Generate Dynamic App Version
        id: app_version
        shell: bash
        run: |
          BASE_VERSION="0.16"
          RUN_NUM="${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="${TAG_VER}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME="${BASE_VERSION}.${RUN_NUM}"
            TAG_NAME="v${VERSION_NAME}"
          fi
          VERSION_CODE=$((100 + RUN_NUM))
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Dynamic Version Assigned: ${VERSION_NAME} (Code: ${VERSION_CODE}, Tag: ${TAG_NAME})"

      - name: Build Project with gradle (Release with R8 Minify & ShrinkResources)
        run: ./gradlew :app:assembleRelease -Dandroid.enableR8.fullMode=false -x test -x lint
        env:
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          ARCH_API_URL: ${{ secrets.ARCH_API_URL }}
          ARCH_CLIENT_KEY: ${{ secrets.ARCH_CLIENT_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Strict Verify libtdjni.so in Built APKs (Nagram-style)
        run: |
          echo "=== 🔍 Strict Verification of Native TDLib (libtdjni.so) in APKs ==="
          FAILED=0
          for apk in ./app/build/outputs/apk/release/*arm64-v8a*.apk ./app/build/outputs/apk/release/*universal*.apk; do
            if [ -f "$apk" ]; then
              echo "Inspecting: $(basename "$apk")"
              if unzip -l "$apk" | grep -E "lib/(arm64-v8a|armeabi-v7a)/libtdjni\.so"; then
                echo "✅ VERIFIED: libtdjni.so successfully found inside $(basename "$apk")"
              else
                echo "❌ CRITICAL ERROR: libtdjni.so is NOT found inside $(basename "$apk")!"
                FAILED=1
              fi
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "❌ BUILD FAILED: One or more target APKs are missing libtdjni.so! Aborting release."
            exit 1
          fi
          echo "🎉 ALL TARGET APKS PASS STRICT NATIVE TDLIB VERIFICATION!"

      # Send built APK directly to Owner's Telegram & register update (saves 100% of GitHub Actions artifact quota)
      - name: Send APK to Telegram Owner & Register Update
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          echo "=== 🚀 Installing Pyrogram, TgCrypto & Requests for MTProto 2.0 Uploads (up to 2GB) ==="
          pip install --quiet pyrogram tgcrypto requests
          echo "=== 🚀 Sending Built APK via Pyrogram MTProto 2.0 ==="
          python3 scripts/telegram_upload.py
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID || secrets.CHAT_ID }}
          ARCH_API_URL: ${{ secrets.ARCH_API_URL }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true) }}

      # Silent GitHub Release (Draft) on normal push / dev builds:
      # Uploads APKs to GitHub Releases without notifying watchers, without updating /releases/latest,
      # and without triggering in-app update popups for users. You can publish it manually anytime.
      - name: Upload Silent Draft Release (No User Notification)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: "KryptonPlayer ${{ steps.app_version.outputs.tag_name }} (Draft Build)"
          body: |
            ### ⚡ KryptonPlayer ${{ steps.app_version.outputs.tag_name }} (Silent Draft Build)
            - Uploaded silently as a **Draft** so users & GitHub watchers are **not** notified.
            - Click **Edit → Publish release** on GitHub whenever you are ready to release this build to users.
          draft: true
          prerelease: false
          make_latest: false
          files: |
            ./app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Official Public GitHub Release: Only runs when a v* tag is pushed (e.g. git push origin v0.16.5)
      # or when manually dispatched with release=true.
      - name: Create or Update Official Public Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: "KryptonPlayer ${{ steps.app_version.outputs.tag_name }} (Official Native TDLib MTProto 2.0)"
          body: |
            ### ⚡ KryptonPlayer ${{ steps.app_version.outputs.tag_name }} Release
            - **Optimized Minified Binary**: Full R8 code & resource shrinking applied.
            - **Native MTProto 2.0 Engine**: `libtdjni.so` strictly verified and packaged in APK.
            - **Zero Server Bandwidth**: High-speed direct streaming and downloads via official Telegram MTProto TCP sockets.
            - **Krypton Material 3 Expressive UI**: Sleek modern UI, custom icons, update manager, and advanced player controls.
            - **Persistent Library Thumbnails**: Fast, zero-flicker offline thumbnails with `.thumb.jpg` caching.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
