name: Update README Stats Bot

on:
  watch:
    types: [started]
  fork:
  release:
    types: [published, edited]
  issues:
    types: [opened, closed, reopened]
  push:
    branches: ['main']
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-readme-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    name: Sync Live Stats, Releases & Contributors
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh README.md from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/update_readme.py

      - name: Commit & Push Updated README
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md."
            exit 0
          fi
          git config user.name "krypton-readme-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): auto-update live stats, releases & contributors [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
